name: Multi-Architecture Builds

on:
  push:
    branches:
      - master
      - stable/*
    paths:
      - 'docker/**'
      - 'kolla/**'
      - '.github/workflows/build-multi-arch.yml'
  pull_request:
    paths:
      - 'docker/**'
      - 'kolla/**'
      - '.github/workflows/build-multi-arch.yml'
  schedule:
    # Run weekly on Monday at 3 AM UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      images:
        description: 'Specific images to build (comma-separated, e.g., nova,neutron)'
        required: false
        default: ''
      architectures:
        description: 'Target architectures (comma-separated, e.g., amd64,arm64)'
        required: false
        default: 'amd64,arm64'

jobs:
  prepare:
    name: Prepare Build Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up matrix
        id: set-matrix
        run: |
          # Define core services to build
          if [ -n "${{ github.event.inputs.images }}" ]; then
            IMAGES="${{ github.event.inputs.images }}"
          else
            # Build core OpenStack services by default
            IMAGES="base,openstack-base,nova,neutron,glance,keystone,horizon,cinder"
          fi
          
          # Define architectures
          if [ -n "${{ github.event.inputs.architectures }}" ]; then
            ARCHS="${{ github.event.inputs.architectures }}"
          else
            ARCHS="amd64,arm64"
          fi
          
          # Convert to JSON array
          IMAGE_ARRAY=$(echo "$IMAGES" | jq -R -s -c 'split(",") | map(select(length > 0))')
          ARCH_ARRAY=$(echo "$ARCHS" | jq -R -s -c 'split(",") | map(select(length > 0))')
          
          # Create matrix
          MATRIX=$(jq -n \
            --argjson images "$IMAGE_ARRAY" \
            --argjson archs "$ARCH_ARRAY" \
            '{image: $images, arch: $archs}')
          
          echo "matrix=${MATRIX}" >> "${GITHUB_OUTPUT}"
          
          echo "📦 Build Matrix:"
          echo "$MATRIX" | jq .

  build:
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Kolla
        run: |
          pip install --upgrade pip
          pip install -e .

      - name: Set up QEMU
        if: matrix.arch != 'amd64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64,linux/arm/v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Docker info
        run: |
          docker info
          docker buildx ls

      - name: Set build variables
        id: vars
        run: |
          # Map architecture names
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            BASE_ARCH="x86_64"
            PLATFORM="linux/amd64"
          elif [ "${{ matrix.arch }}" = "arm64" ]; then
            BASE_ARCH="aarch64"
            PLATFORM="linux/arm64"
          elif [ "${{ matrix.arch }}" = "armv7" ]; then
            BASE_ARCH="armv7l"
            PLATFORM="linux/arm/v7"
          fi
          
          echo "base_arch=${BASE_ARCH}" >> "${GITHUB_OUTPUT}"
          echo "platform=${PLATFORM}" >> "${GITHUB_OUTPUT}"
          
          # Set image tag
          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            TAG="master-${{ matrix.arch }}"
          else
            TAG="${{ github.ref_name }}-${{ matrix.arch }}"
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          
          echo "🏗️  Building for:"
          echo "  Architecture: ${{ matrix.arch }}"
          echo "  Base Arch: ${BASE_ARCH}"
          echo "  Platform: ${PLATFORM}"
          echo "  Tag: ${TAG}"

      - name: Free disk space
        run: |
          echo "Disk space before cleanup:"
          df -h
          
          # Remove unnecessary files to free up space
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          
          echo "Disk space after cleanup:"
          df -h

      - name: Build image
        id: build
        run: |
          echo "🔨 Building ${{ matrix.image }} for ${{ steps.vars.outputs.platform }}"
          
          kolla-build \
            --base ubuntu \
            --type binary \
            --tag "${{ steps.vars.outputs.tag }}" \
            --base-arch "${{ steps.vars.outputs.base_arch }}" \
            --platform "${{ steps.vars.outputs.platform }}" \
            --template-override /dev/null \
            --debug \
            ${{ matrix.image }} 2>&1 | tee build.log
          
          BUILD_STATUS=$?
          
          if [ $BUILD_STATUS -eq 0 ]; then
            echo "✅ Build successful"
            echo "status=success" >> "${GITHUB_OUTPUT}"
          else
            echo "❌ Build failed"
            echo "status=failure" >> "${GITHUB_OUTPUT}"
            exit 1
          fi

      - name: Inspect built image
        if: steps.build.outputs.status == 'success'
        run: |
          IMAGE_NAME="kolla/${{ matrix.image }}:${{ steps.vars.outputs.tag }}"
          
          echo "📋 Image details:"
          docker images "${IMAGE_NAME}"
          
          echo ""
          echo "🔍 Image inspection:"
          docker inspect "${IMAGE_NAME}" | jq '.[0] | {
            Architecture: .Architecture,
            Os: .Os,
            Size: .Size,
            Created: .Created,
            Config: {
              Labels: .Config.Labels,
              Env: .Config.Env | map(select(startswith("KOLLA")))
            }
          }'

      - name: Test image
        if: steps.build.outputs.status == 'success'
        run: |
          IMAGE_NAME="kolla/${{ matrix.image }}:${{ steps.vars.outputs.tag }}"
          
          echo "🧪 Testing image..."
          
          # Check if image can run
          if docker run --rm --platform "${{ steps.vars.outputs.platform }}" \
             "${IMAGE_NAME}" bash -c 'echo "✓ Container started successfully"'; then
            echo "✅ Image test passed"
          else
            echo "❌ Image test failed"
            exit 1
          fi

      - name: Calculate image metrics
        if: steps.build.outputs.status == 'success'
        id: metrics
        run: |
          IMAGE_NAME="kolla/${{ matrix.image }}:${{ steps.vars.outputs.tag }}"
          
          # Get image size in MB
          SIZE=$(docker images "${IMAGE_NAME}" --format "{{.Size}}" | sed 's/MB//' | sed 's/GB/*1024/')
          SIZE_MB=$(echo "${SIZE}" | bc 2>/dev/null || echo "0")
          
          # Get layer count
          LAYERS=$(docker history "${IMAGE_NAME}" --no-trunc | wc -l)
          
          echo "size_mb=${SIZE_MB}" >> "${GITHUB_OUTPUT}"
          echo "layers=${LAYERS}" >> "${GITHUB_OUTPUT}"
          
          echo "📊 Image metrics:"
          echo "  Size: ${SIZE_MB} MB"
          echo "  Layers: ${LAYERS}"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.image }}-${{ matrix.arch }}
          path: build.log
          retention-days: 7

      - name: Export image
        if: steps.build.outputs.status == 'success' && github.event_name == 'push'
        run: |
          IMAGE_NAME="kolla/${{ matrix.image }}:${{ steps.vars.outputs.tag }}"
          
          mkdir -p images
          docker save "${IMAGE_NAME}" | gzip > "images/${{ matrix.image }}-${{ matrix.arch }}.tar.gz"
          
          echo "💾 Exported image to images/${{ matrix.image }}-${{ matrix.arch }}.tar.gz"
          ls -lh images/

      - name: Upload image artifact
        if: steps.build.outputs.status == 'success' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.image }}-${{ matrix.arch }}
          path: images/${{ matrix.image }}-${{ matrix.arch }}.tar.gz
          retention-days: 3

  report:
    name: Build Report
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate report
        run: |
          echo "# 📊 Multi-Architecture Build Report" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "**Workflow:** ${GITHUB_WORKFLOW}" >> "${GITHUB_STEP_SUMMARY}"
          echo "**Trigger:** ${GITHUB_EVENT_NAME}" >> "${GITHUB_STEP_SUMMARY}"
          echo "**Branch:** ${GITHUB_REF_NAME}" >> "${GITHUB_STEP_SUMMARY}"
          echo "**Commit:** ${GITHUB_SHA:0:8}" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "## Build Status" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "Build job status: ${{ needs.build.result }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "✅ Check individual job results above for detailed status." >> "${GITHUB_STEP_SUMMARY}"
