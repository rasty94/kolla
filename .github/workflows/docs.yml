---
name: Documentation

on:
  push:
    branches: [master, 'stable/**']
    paths:
      - 'doc/**'
      - 'README.rst'
      - '**.md'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [master, 'stable/**']
    paths:
      - 'doc/**'
      - 'README.rst'
      - '**.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r doc/requirements.txt
          pip install -r requirements.txt
          pip install -e .
      
      - name: Build HTML documentation
        run: |
          cd doc
          make html
        env:
          SPHINXOPTS: "-W --keep-going"
      
      - name: Check for broken links
        run: |
          cd doc
          make linkcheck || true
      
      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: documentation-html
          path: doc/build/html/
          retention-days: 7

  validate-rst:
    name: Validate RST Files
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install rstcheck
        run: pip install rstcheck
      
      - name: Check RST files
        run: |
          find . -name "*.rst" -not -path "./doc/build/*" -not -path "./.tox/*" | xargs rstcheck --report-level warning || true

  check-links:
    name: Check External Links
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check links in markdown
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          use-verbose-mode: 'no'
          config-file: '.github/markdown-link-check-config.json'
        continue-on-error: true

  check-spelling:
    name: Check Documentation Spelling
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run codespell on docs
        uses: codespell-project/actions-codespell@v2
        with:
          path: doc/
          ignore_words_list: crate,pullrequest,pullrequests,nd,ans
          skip: "*.git,*.svg,*.png,*.jpg,*.jpeg,*.pdf"

  release-notes:
    name: Validate Release Notes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install reno
        run: pip install reno
      
      - name: Check for release notes
        run: |
          # Check if there are code changes that might need release notes
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q "^kolla/"; then
            echo "Code changes detected, checking for release notes..."
            if ! git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q "^releasenotes/notes/"; then
              echo "::warning::Consider adding a release note for this change"
            fi
          fi
      
      - name: Validate release notes format
        run: |
          reno lint || true

  docs-summary:
    name: Documentation Summary
    runs-on: ubuntu-latest
    needs: [build-docs, validate-rst, check-links, check-spelling]
    if: always()
    
    steps:
      - name: Check documentation results
        run: |
          if [ "${{ needs.build-docs.result }}" != "success" ]; then
            echo "Documentation build failed"
            exit 1
          fi
          echo "Documentation checks completed!"
