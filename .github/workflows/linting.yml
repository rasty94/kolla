---
name: Linting

on:
  push:
    branches: [master, 'stable/**']
  pull_request:
    branches: [master, 'stable/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Ruff (Python linting & formatting)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install ruff
        run: pip install ruff
      
      - name: Run ruff check
        run: ruff check .
      
      - name: Run ruff format check
        run: ruff format --check .

  bandit:
    name: Bandit (Security)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install bandit
        run: pip install bandit[toml]
      
      - name: Run bandit
        run: bandit -c pyproject.toml -r kolla/

  pydocstyle:
    name: Pydocstyle (Docstrings)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install pydocstyle
        run: pip install pydocstyle
      
      - name: Run pydocstyle
        run: pydocstyle kolla/

  shellcheck:
    name: Shellcheck (Shell scripts)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          ignore_paths: .git .github

  yamllint:
    name: Yamllint (YAML files)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          config_data: |
            extends: default
            rules:
              line-length:
                max: 120
                level: warning
              document-start: disable
              comments:
                min-spaces-from-content: 1

  hadolint:
    name: Hadolint (Dockerfiles)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: "docker/*/Dockerfile*"
          recursive: true
          failure-threshold: warning

  ansible-lint:
    name: Ansible Lint (Playbooks)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install ansible-lint
        run: pip install ansible-lint
      
      - name: Run ansible-lint
        run: |
          # Only lint if there are ansible files
          if find . -name "*.yml" -o -name "*.yaml" | grep -q .; then
            ansible-lint || exit 0
          fi

  codespell:
    name: Codespell (Spell check)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run codespell
        uses: codespell-project/actions-codespell@v2
        with:
          ignore_words_list: crate,pullrequest,pullrequests
          skip: "*.git,*.lock,*.sum,*.svg,*.png,*.jpg,*.jpeg"

  markdown-lint:
    name: Markdownlint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run markdownlint
        uses: nosborn/github-action-markdown-cli@v3.3.0
        with:
          files: .
          config_file: .markdownlint.json
          ignore_files: .git/
          dot: true
        continue-on-error: true

  lint-summary:
    name: Lint Summary
    runs-on: ubuntu-latest
    needs: [ruff, bandit, pydocstyle, shellcheck, yamllint, hadolint, ansible-lint, codespell]
    if: always()
    
    steps:
      - name: Check lint results
        run: |
          if [ "${{ needs.ruff.result }}" != "success" ] || \
             [ "${{ needs.bandit.result }}" != "success" ] || \
             [ "${{ needs.pydocstyle.result }}" != "success" ] || \
             [ "${{ needs.shellcheck.result }}" != "success" ] || \
             [ "${{ needs.yamllint.result }}" != "success" ] || \
             [ "${{ needs.hadolint.result }}" != "success" ] || \
             [ "${{ needs.ansible-lint.result }}" != "success" ] || \
             [ "${{ needs.codespell.result }}" != "success" ]; then
            echo "Some linting checks failed"
            exit 1
          fi
          echo "All linting checks passed!"
