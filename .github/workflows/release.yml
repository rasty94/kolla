---
name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+.0rc[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+.0b[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 2025.1.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  validate-version:
    name: Validate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      is_prerelease: ${{ steps.check-prerelease.outputs.is_prerelease }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Get version
        id: get-version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Version: ${VERSION}"
      
      - name: Check if pre-release
        id: check-prerelease
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          if [[ "${VERSION}" =~ (rc|b|a) ]]; then
            echo "is_prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "is_prerelease=false" >> "${GITHUB_OUTPUT}"
          fi

  build-package:
    name: Build Python Package
    needs: validate-version
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel setuptools pbr
      
      - name: Build package
        run: |
          python -m build
      
      - name: Check package
        run: |
          pip install twine
          twine check dist/*
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/
          retention-days: 30

  generate-release-notes:
    name: Generate Release Notes
    needs: validate-version
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.generate.outputs.notes }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install reno
        run: pip install reno
      
      - name: Generate release notes
        id: generate
        run: |
          VERSION="${{ needs.validate-version.outputs.version }}"
          reno report --version "${VERSION}" > release-notes.txt || echo "No release notes found" > release-notes.txt
          
          # Create multiline output
          {
            echo 'notes<<EOF'
            cat release-notes.txt
            echo 'EOF'
          } >> "${GITHUB_OUTPUT}"
      
      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.txt
          retention-days: 30

  build-multi-arch-images:
    name: Build Multi-Arch Images (${{ matrix.arch }})
    needs: validate-version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        image: [base, openstack-base, nova, neutron, glance, keystone, horizon, cinder, heat, placement]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install Kolla
        run: |
          pip install --upgrade pip
          pip install -e .
      
      - name: Set up QEMU
        if: matrix.arch != 'amd64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Set build variables
        id: vars
        run: |
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            BASE_ARCH="x86_64"
            PLATFORM="linux/amd64"
          elif [ "${{ matrix.arch }}" = "arm64" ]; then
            BASE_ARCH="aarch64"
            PLATFORM="linux/arm64"
          fi
          
          echo "base_arch=${BASE_ARCH}" >> "${GITHUB_OUTPUT}"
          echo "platform=${PLATFORM}" >> "${GITHUB_OUTPUT}"
          
          VERSION="${{ needs.validate-version.outputs.version }}"
          echo "tag=${VERSION}-${{ matrix.arch }}" >> "${GITHUB_OUTPUT}"
      
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
      
      - name: Build image
        run: |
          kolla-build \
            --base ubuntu \
            --type binary \
            --tag "${{ steps.vars.outputs.tag }}" \
            --base-arch "${{ steps.vars.outputs.base_arch }}" \
            --platform "${{ steps.vars.outputs.platform }}" \
            --registry ghcr.io/${{ github.repository_owner }} \
            --push \
            ${{ matrix.image }}
        env:
          DOCKER_USERNAME: ${{ github.actor }}
          DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Test image
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/kolla/${{ matrix.image }}:${{ steps.vars.outputs.tag }}"
          docker run --rm --platform "${{ steps.vars.outputs.platform }}" \
            "${IMAGE_NAME}" bash -c 'echo "✓ Image test passed"'

  create-multi-arch-manifests:
    name: Create Multi-Arch Manifests
    needs: [validate-version, build-multi-arch-images]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [base, openstack-base, nova, neutron, glance, keystone, horizon, cinder, heat, placement]
    
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create and push manifest
        run: |
          VERSION="${{ needs.validate-version.outputs.version }}"
          IMAGE_BASE="ghcr.io/${{ github.repository_owner }}/kolla/${{ matrix.image }}"
          
          # Create manifest list
          docker buildx imagetools create -t "${IMAGE_BASE}:${VERSION}" \
            "${IMAGE_BASE}:${VERSION}-amd64" \
            "${IMAGE_BASE}:${VERSION}-arm64"
          
          # Also tag as latest if not pre-release
          if [ "${{ needs.validate-version.outputs.is_prerelease }}" = "false" ]; then
            docker buildx imagetools create -t "${IMAGE_BASE}:latest" \
              "${IMAGE_BASE}:${VERSION}-amd64" \
              "${IMAGE_BASE}:${VERSION}-arm64"
          fi
          
          echo "✅ Created multi-arch manifest for ${{ matrix.image }}"

  create-github-release:
    name: Create GitHub Release
    needs: [validate-version, build-package, generate-release-notes]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist/
      
      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ needs.validate-version.outputs.version }}
          body_path: release-notes.txt
          draft: false
          prerelease: ${{ needs.validate-version.outputs.is_prerelease == 'true' }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-pypi:
    name: Publish to PyPI
    needs: [validate-version, build-package, create-github-release]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && needs.validate-version.outputs.is_prerelease == 'false'
    environment:
      name: pypi
      url: https://pypi.org/project/kolla
    
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist/
      
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

  notify-release:
    name: Notify Release
    needs: [validate-version, create-github-release]
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'push'
    
    steps:
      - name: Release Summary
        run: |
          {
            echo "## Release Summary"
            echo ""
            echo "**Version:** ${{ needs.validate-version.outputs.version }}"
            echo "**Pre-release:** ${{ needs.validate-version.outputs.is_prerelease }}"
            echo "**Status:** ${{ needs.create-github-release.result }}"
            echo ""
            echo "Release available at: https://github.com/${{ github.repository }}/releases/tag/${{ needs.validate-version.outputs.version }}"
          } >> "${GITHUB_STEP_SUMMARY}"
