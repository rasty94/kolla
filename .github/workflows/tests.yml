---
name: Tests

on:
  push:
    branches: [master, 'stable/**']
  pull_request:
    branches: [master, 'stable/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -r test-requirements.txt
          pip install -e .
      
      - name: Run unit tests
        run: |
          stestr run
      
      - name: Generate coverage report
        if: matrix.python-version == '3.11'
        run: |
          coverage combine || true
          coverage xml || true
          coverage report || true
      
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: python-${{ matrix.python-version }}
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  functional-tests:
    name: Functional Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r test-requirements.txt
          pip install -e .
      
      - name: Run functional tests
        run: |
          # Run Docker image build tests
          python -m pytest tests/ -v -k "test_build"

  build-verification:
    name: Build Verification
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      
      - name: Verify build script
        run: |
          python tools/build.py --help
      
      - name: Test configuration parsing
        run: |
          python -c "import kolla; print(kolla.__version__)"

  multi-arch-build-test:
    name: Multi-Arch Build Test (${{ matrix.arch }})
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        image: [base]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install Kolla
        run: |
          pip install --upgrade pip
          pip install -e .
      
      - name: Set up QEMU
        if: matrix.arch != 'amd64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Set build variables
        id: vars
        run: |
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            BASE_ARCH="x86_64"
            PLATFORM="linux/amd64"
          elif [ "${{ matrix.arch }}" = "arm64" ]; then
            BASE_ARCH="aarch64"
            PLATFORM="linux/arm64"
          fi
          
          echo "base_arch=${BASE_ARCH}" >> "${GITHUB_OUTPUT}"
          echo "platform=${PLATFORM}" >> "${GITHUB_OUTPUT}"
      
      - name: Build test image
        run: |
          kolla-build \
            --base ubuntu \
            --type binary \
            --tag "test-${{ matrix.arch }}" \
            --base-arch "${{ steps.vars.outputs.base_arch }}" \
            --platform "${{ steps.vars.outputs.platform }}" \
            --template-only \
            ${{ matrix.image }}
      
      - name: Verify Dockerfile
        run: |
          DOCKERFILE="docker/${{ matrix.image }}/Dockerfile"
          if [ -f "${DOCKERFILE}" ]; then
            echo "✅ Dockerfile generated successfully"
            echo "📋 Dockerfile preview:"
            head -n 20 "${DOCKERFILE}"
          else
            echo "❌ Dockerfile not found"
            exit 1
          fi

  test-matrix-summary:
    name: Test Matrix Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, functional-tests, build-verification, multi-arch-build-test]
    if: always()
    
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.functional-tests.result }}" != "success" ] || \
             [ "${{ needs.build-verification.result }}" != "success" ]; then
            echo "⚠️  Some core tests failed"
            exit 1
          fi
          
          # Multi-arch tests are optional (may be skipped)
          if [ "${{ needs.multi-arch-build-test.result }}" = "failure" ]; then
            echo "⚠️  Multi-arch tests failed"
            exit 1
          fi
          
          echo "✅ All tests passed!"
