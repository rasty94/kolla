[build-system]
requires = ["setuptools>=64.0.0", "wheel", "pbr>=2.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kolla"
dynamic = ["version"]
description = "Kolla OpenStack Deployment"
readme = "README.rst"
requires-python = ">=3.8"
license = {text = "Apache License, Version 2.0"}
authors = [
    {name = "OpenStack", email = "openstack-discuss@lists.openstack.org"}
]
classifiers = [
    "Environment :: OpenStack",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pbr>=2.0.0,!=2.1.0",
    "Jinja2>=3.0.1",
    "GitPython>=1.0.1",
    "oslo.config>=5.1.0",
    "setuptools>=64.0.0",
]

[project.urls]
Homepage = "https://docs.openstack.org/kolla/latest/"
Documentation = "https://docs.openstack.org/kolla/latest/"
Repository = "https://opendev.org/openstack/kolla"
"Bug Tracker" = "https://bugs.launchpad.net/kolla"

[project.scripts]
kolla-build = "kolla.cmd.build:main"

[project.optional-dependencies]
test = [
    "ansible-core>=2.17,<2.19",
    "ansible-compat<25.8",
    "ansible-lint<26",
    "bandit>=1.1.0,!=1.6.0",
    "bashate>=0.5.1",
    "coverage>=4.0,!=4.4",
    "ddt>=1.0.1",
    "docker>=3.0.0",
    "hacking>=7.0.0,<=7.1.0",
    "oslotest>=3.2.0",
    "stestr>=2.2.0",
    "testtools>=2.2.0",
]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["kolla*"]
exclude = ["tests*"]

[tool.setuptools.dynamic]
version = {attr = "pbr.version.VersionInfo('kolla').version_string()"}

[tool.pbr]
skip_git_sdist = false
skip_changelog = false
skip_authors = false

# Ruff configuration
[tool.ruff]
line-length = 88
target-version = "py38"
exclude = [
    ".eggs",
    ".git",
    ".tox",
    ".venv",
    "_build",
    "build",
    "dist",
    "doc/build",
    "releasenotes",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "B904",  # raise from
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["S101"]  # Allow assert in tests

[tool.ruff.lint.isort]
known-first-party = ["kolla"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# Bandit configuration
[tool.bandit]
exclude_dirs = [
    ".eggs",
    ".git",
    ".tox",
    ".venv",
    "build",
    "dist",
    "tests",
]
skips = [
    "B404",  # import subprocess
    "B603",  # subprocess without shell=True
]

# Coverage configuration
[tool.coverage.run]
branch = true
source = ["kolla"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    ".tox/*",
]

[tool.coverage.report]
ignore_errors = true
precision = 2
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.coverage.html]
directory = "cover"

# isort configuration
[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["kolla"]
skip_glob = [
    ".eggs/*",
    ".tox/*",
    "build/*",
    "dist/*",
]

# mypy configuration
[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "^build/",
    "^.tox/",
    "^.eggs/",
]

# pytest configuration
[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
]

# pydocstyle configuration
[tool.pydocstyle]
convention = "pep257"
add_ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D107"]
match = "(?!test_).*\\.py"

# pylint configuration (optional)
[tool.pylint.messages_control]
disable = [
    "C0111",  # missing-docstring
    "C0103",  # invalid-name
    "R0913",  # too-many-arguments
]

[tool.pylint.format]
max-line-length = 88
